<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 966">
<defs>
<marker id="arrow-entry" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
<marker id="arrow-control" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/></marker>
<marker id="arrow-write" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/></marker>
<marker id="arrow-model" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#4f46e5"/></marker>
<marker id="arrow-tool" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#f97316"/></marker>
<marker id="arrow-muted" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
</defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.title { font-size: 24px; font-weight: 700; fill: #0f172a; }
.subtitle { font-size: 13px; font-weight: 500; fill: #64748b; }
.participant-label { font-size: 14px; font-weight: 700; fill: #0f172a; }
.participant-type { font-size: 11px; font-weight: 700; fill: #94a3b8; letter-spacing: 0.08em; }
.message { font-size: 12px; font-weight: 500; fill: #334155; }
.note { font-size: 12px; font-weight: 500; fill: #475569; }
.frame { font-size: 12px; font-weight: 700; fill: #475569; }
.lifeline { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 5,4; }
</style>
<rect width="1500" height="966" fill="#ffffff"/>
<text x="750.0" y="42" text-anchor="middle" class="title">Hermes Request -&gt; Tool Execution Sequence</text>
<text x="750.0" y="68" text-anchor="middle" class="subtitle">Representative flow from an interface shell through AIAgent, model round-trips, tool dispatch, and persistence</text>
<rect x="432" y="332" width="916" height="278" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="7 5"/>
<rect x="446" y="320.0" width="489.0" height="24" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="458" y="336.0" text-anchor="start" class="frame">tool loop (0..n) — request tool, execute, return result, continue inference</text>
<rect x="280.0" y="166" width="20" height="698" rx="8" fill="#dbeafe" stroke="#2563eb" opacity="0.95"/>
<rect x="480.0" y="206" width="20" height="660" rx="8" fill="#ede9fe" stroke="#7c3aed" opacity="0.95"/>
<rect x="680.0" y="246" width="20" height="54" rx="8" fill="#d1fae5" stroke="#10b981" opacity="0.95"/>
<rect x="680.0" y="726" width="20" height="56" rx="8" fill="#d1fae5" stroke="#10b981" opacity="0.95"/>
<rect x="880.0" y="306" width="20" height="404" rx="8" fill="#e0e7ff" stroke="#4f46e5" opacity="0.95"/>
<rect x="1080.0" y="426" width="20" height="164" rx="8" fill="#ffedd5" stroke="#f97316" opacity="0.95"/>
<rect x="1280.0" y="476" width="20" height="74" rx="8" fill="#ffedd5" stroke="#f97316" opacity="0.95"/>
<rect x="26.0" y="86" width="128" height="56" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="90" y="104" text-anchor="middle" class="participant-type">ACTOR</text>
<text x="90" y="125" text-anchor="middle" class="participant-label">User</text>
<line x1="90" y1="150" x2="90" y2="918" class="lifeline"/>
<rect x="226.0" y="86" width="128" height="56" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="290" y="104" text-anchor="middle" class="participant-type">SHELL</text>
<text x="290" y="125" text-anchor="middle" class="participant-label">Interface Shell</text>
<line x1="290" y1="150" x2="290" y2="918" class="lifeline"/>
<rect x="426.0" y="86" width="128" height="56" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="490" y="104" text-anchor="middle" class="participant-type">CORE</text>
<text x="490" y="125" text-anchor="middle" class="participant-label">AIAgent</text>
<line x1="490" y1="150" x2="490" y2="918" class="lifeline"/>
<rect x="626.0" y="86" width="128" height="56" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="690" y="104" text-anchor="middle" class="participant-type">STATE</text>
<text x="690" y="125" text-anchor="middle" class="participant-label">SessionDB</text>
<line x1="690" y1="150" x2="690" y2="918" class="lifeline"/>
<rect x="826.0" y="86" width="128" height="56" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="890" y="104" text-anchor="middle" class="participant-type">MODEL</text>
<text x="890" y="125" text-anchor="middle" class="participant-label">Model API</text>
<line x1="890" y1="150" x2="890" y2="918" class="lifeline"/>
<rect x="1026.0" y="86" width="128" height="56" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="1090" y="104" text-anchor="middle" class="participant-type">ROUTER</text>
<text x="1090" y="125" text-anchor="middle" class="participant-label">Tool Router</text>
<line x1="1090" y1="150" x2="1090" y2="918" class="lifeline"/>
<rect x="1226.0" y="86" width="128" height="56" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="1290" y="104" text-anchor="middle" class="participant-type">EXECUTION</text>
<text x="1290" y="125" text-anchor="middle" class="participant-label">Tool Backend</text>
<line x1="1290" y1="150" x2="1290" y2="918" class="lifeline"/>
<line x1="90" y1="166" x2="290" y2="166" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-entry)"/>
<text x="190.0" y="158" text-anchor="middle" class="message">1. submit prompt</text>
<line x1="290" y1="206" x2="490" y2="206" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-entry)"/>
<text x="390.0" y="198" text-anchor="middle" class="message">2. run_conversation()</text>
<line x1="490" y1="246" x2="690" y2="246" stroke="#10b981" stroke-width="2.2" marker-end="url(#arrow-write)"/>
<text x="590.0" y="238" text-anchor="middle" class="message">3. load history / todo state</text>
<line x1="490" y1="306" x2="890" y2="306" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrow-control)"/>
<text x="690.0" y="298" text-anchor="middle" class="message">4. send messages + tool schemas</text>
<line x1="890" y1="366" x2="490" y2="366" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arrow-model)"/>
<text x="684.0" y="358" text-anchor="middle" class="message">5. return tool call request</text>
<line x1="490" y1="426" x2="1090" y2="426" stroke="#f97316" stroke-width="2.2" marker-end="url(#arrow-tool)"/>
<text x="790.0" y="418" text-anchor="middle" class="message">6. resolve + dispatch tool</text>
<line x1="1090" y1="476" x2="1290" y2="476" stroke="#f97316" stroke-width="2.2" marker-end="url(#arrow-tool)"/>
<text x="1190.0" y="468" text-anchor="middle" class="message">7. execute tool</text>
<line x1="1290" y1="526" x2="1090" y2="526" stroke="#f97316" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow-tool)"/>
<text x="1184.0" y="518" text-anchor="middle" class="message">8. tool result</text>
<line x1="1090" y1="576" x2="490" y2="576" stroke="#f97316" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow-tool)"/>
<text x="784.0" y="568" text-anchor="middle" class="message">9. normalized JSON result</text>
<line x1="490" y1="646" x2="890" y2="646" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrow-control)"/>
<text x="690.0" y="638" text-anchor="middle" class="message">10. continue with tool output</text>
<line x1="890" y1="706" x2="490" y2="706" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arrow-model)"/>
<text x="684.0" y="698" text-anchor="middle" class="message">11. final answer</text>
<line x1="490" y1="746" x2="690" y2="746" stroke="#10b981" stroke-width="2.2" marker-end="url(#arrow-write)"/>
<text x="590.0" y="738" text-anchor="middle" class="message">12. persist transcript + usage</text>
<line x1="490" y1="806" x2="290" y2="806" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-entry)"/>
<text x="384.0" y="798" text-anchor="middle" class="message">13. final response + tool progress</text>
<line x1="290" y1="846" x2="90" y2="846" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-entry)"/>
<text x="184.0" y="838" text-anchor="middle" class="message">14. render output</text>
<rect x="1114" y="620" width="250" height="64" rx="10" fill="#fff7ed" stroke="#fdba74"/>
<text x="1126" y="644" text-anchor="start" class="note">Tool batches can run in parallel</text>
<text x="1126" y="660" text-anchor="start" class="note">when the registry marks them safe.</text>
</svg>
